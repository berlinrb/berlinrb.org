name: Board

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show where cards would go without moving them
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write
  actions: write

# Calls Copilot Triage's action directly, like issue-assessment.yml, so the
# project token reaches it.
jobs:
  sweep:
    concurrency:
      group: board
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: crmne/copilot-triage@v0
        with:
          mode: sweep
          project-token: ${{ secrets.TRIAGE_PROJECT_TOKEN }}
          triage-workflow: issue-assessment.yml
          dry-run: ${{ inputs.dry_run || false }}
