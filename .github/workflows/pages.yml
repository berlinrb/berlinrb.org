name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 23 * * *" # just after midnight in Berlin, so a finished meetup moves to past
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sitemap lastmod comes from each page's last commit
      - uses: actions/configure-pages@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
      - name: Test
        run: for test in test/*_test.rb; do ruby "$test" || exit 1; done
      - name: Build the site
        run: bin/build
      - name: Build the press kit zip
        run: |
          mkdir -p build/berlinrb-press-kit
          cp assets/logo.svg assets/logo.png \
             assets/logo-dark.svg assets/logo-dark.png \
             assets/logo-square.png press/about-berlinrb.txt \
             build/berlinrb-press-kit/
          (cd build && zip -qr ../_site/press/berlinrb-press-kit.zip berlinrb-press-kit)
          rm -rf build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
