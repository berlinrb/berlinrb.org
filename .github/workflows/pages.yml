name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sitemap lastmod comes from each page's last commit
      - uses: actions/configure-pages@v5
      - name: Check that /cfp redirects to the form the site opens
        run: |
          form_ids=$(grep -oh 'data-tally-open="[^"]*"' index.html */index.html | cut -d'"' -f2 | sort -u)
          if [ "$(printf '%s\n' "$form_ids" | grep -c .)" -ne 1 ]; then
            echo "::error::Expected exactly one Tally form id across the pages, found: $(echo $form_ids)"
            exit 1
          fi
          form_url="https://tally.so/r/$form_ids"
          for expected in "content=\"0; url=$form_url\"" "href=\"$form_url\""; do
            if ! grep -qF "$expected" cfp/index.html; then
              echo "::error file=cfp/index.html::/cfp is missing $expected"
              exit 1
            fi
          done
      - name: Build the press kit zip
        run: |
          mkdir -p build/berlinrb-press-kit
          cp assets/logo.svg assets/logo.png \
             assets/logo-dark.svg assets/logo-dark.png \
             assets/logo-square.png press/about-berlinrb.txt \
             build/berlinrb-press-kit/
          (cd build && zip -qr ../press/berlinrb-press-kit.zip berlinrb-press-kit)
          rm -rf build
      - name: Build the sitemap
        run: |
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            for page in index.html press/index.html imprint/index.html privacy/index.html; do
              printf '  <url><loc>https://berlinrb.org/%s</loc><lastmod>%s</lastmod></url>\n' \
                "${page%index.html}" "$(git log -1 --format=%cs -- "$page")"
            done
            echo '</urlset>'
          } > sitemap.xml
          cat sitemap.xml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
