name: Update meetups and talks

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: site-data

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
      - name: Fetch meetups from Luma and recordings from YouTube
        run: bin/sync luma youtube
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/site-data
          delete-branch: true
          commit-message: "Update meetups and talks from Luma and YouTube"
          title: Update meetups and talks from Luma and YouTube
          body: |
            Meetups from the [Luma calendar](https://luma.com/berlinrb) and recordings from the [YouTube channel](https://www.youtube.com/@berlinrb_org), fetched by `bin/sync`.

            Check the dates, venues, and that each video landed on the right talk before merging.
