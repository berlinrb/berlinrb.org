name: Check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
      - name: Check image sizes and thumbnails
        run: bin/check-images
      - name: Test
        run: for test in test/*_test.rb; do ruby "$test" || exit 1; done
