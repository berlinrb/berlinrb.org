  - speaker: Carmine Paolino
    title: 'RubyLLM 2.0: Beyond Agents'
    abstract: 'RubyLLM made Ruby an AI language: one beautiful API for every provider,
      11+ million downloads. 2.0 makes it a full framework: the agentic loop as public
      API, durable approval-gated agents, the most precise cost ledger in AI, caching,
      batches, fallbacks, citations, cancellation, server tools, speech, video, OCR,
      reranking, and a generator that writes provider gems. Ruby is where you ship
      AI.'
