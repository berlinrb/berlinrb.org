  - speaker: Rafał Cymerys
    title: 'Let Your Software Write Its Own Code: Runtime Code Generation in Production'
    abstract: |-
      What happens when an AI coding agent lives inside your application, and writes and executes code at runtime?

      This talk explores this perspective on AI coding - rather than helping the developer write software, help the user overcome problems that you never built an explicit feature for: common examples include importing an unknown file format, or generating custom report dashboards on the fly.
    format: Talk (40 min)
    video: F2uDIEjhdbc
