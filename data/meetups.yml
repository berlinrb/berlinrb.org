  talks:
  - speaker: Paweł Strzałkowski
    title: HiFuMi - The story of building an online Rails apps generator
    abstract: Today’s AI web generators output JavaScript, leaving millions of creators
      outside the Rails ecosystem. Hifumi fixes this as an open-source online RoR
      app generator. The talk is the story of bringing Hifumi to life, sharing the
      struggles, the wins, and the architectural lessons learned. Filled with live
      demos and lessons for future similar projects.
    format: Talk (40 min)
    video: Be3S4-CyXQ0
  - speaker: Carmine Paolino
    title: 'RubyLLM 2.0: Beyond Agents'
    abstract: 'RubyLLM made Ruby an AI language: one beautiful API for every provider,
      11+ million downloads. 2.0 makes it a full framework: the agentic loop as public
      API, durable approval-gated agents, the most precise cost ledger in AI, caching,
      batches, fallbacks, citations, cancellation, server tools, speech, video, OCR,
      reranking, and a generator that writes provider gems. Ruby is where you ship
      AI.'
    format: Talk (40 min)
    video: 6FAexWLxu6w
  livestream_luma: psvh08jx
  signups_online: 46
  about: |-
    <p>We&#39;re kicking off Berlin.rb, a new, regular meetup for Berlin&#39;s Ruby community!</p>
    <p>Join us for our first get-together, kicking off with a couple of talks.</p>
    <ul><li>Carmine Paolino, presents RubyLLM 2.0 - Beyond Agents</li><li>Paweł Strzałkowski, presents HiFuMi - The story of building an online Rails apps generator</li></ul>
    <p>But more than anything, this evening is about bringing Berlin&#39;s Ruby community together.</p>
    <p>Whether you&#39;ve been writing Ruby for 15 years or you&#39;re just curious about the language, everyone&#39;s welcome.</p>
    <p>Drinks and snacks provided. Interested in giving a talk at a future meetup, or hosting/sponsoring one? Reach out to hello@berlinrb.org.</p>
    <p>See you there!</p>
    <p>Watching from home: the talks are streamed live. Register for the live stream event instead: <a href="https://luma.com/psvh08jx">https://luma.com/psvh08jx</a>. Please only register here if you&#39;re coming to the venue, so we know how many seats and how much food we need.</p>
    <p>Getting there: the venue is wheelchair accessible. If you need anything else to join us, write to hello@berlinrb.org and we will arrange it.</p>
    <p>Filming: the talks are recorded and published on our YouTube channel. The camera stands behind the audience and points at the stage, so you may end up in the shot. Tell us at the door if you would rather not be, and we will keep you out of frame.</p>
